<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>🍽 SFWMS</h2>

        <ul>

            <li>
                <a href="dashboard.html" class="active">
                    <i class="fa fa-home"></i> Dashboard
                </a>
            </li>

            <li>
                <a href="food.html">
                    <i class="fa fa-utensils"></i> Food
                </a>
            </li>

            <li>
                <a href="waste.html">
                    <i class="fa fa-trash"></i> Waste
                </a>
            </li>

            <li>
                <a href="donation.html">
                    <i class="fa fa-heart"></i> Donation
                </a>
            </li>

           

            <li>
                <a href="profile.html">
                    <i class="fa fa-user"></i> Profile
                </a>
            </li>

            <li>
                <a href="#" onclick="logout()">
                    <i class="fa fa-sign-out-alt"></i> Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main">

        <div class="topbar">

            <h1>Dashboard</h1>

            <h3>Welcome 👋</h3>

        </div>

        <!-- Dashboard Cards -->

        <div class="cards">

            <div class="card dashboard-card">

                <h2 id="userCount">0</h2>

                <p>Total Users</p>

            </div>

            <div class="card dashboard-card">

                <h2 id="foodCount">0</h2>

                <p>Total Foods</p>

            </div>

            <div class="card dashboard-card">

                <h2 id="wasteCount">0</h2>

                <p>Waste Reports</p>

            </div>

            <div class="card dashboard-card">

                <h2 id="donationCount">0</h2>

                <p>Total Donations</p>

            </div>

        </div>

        <!-- Recent Food Records -->

        <div class="card">

            <h2>Recent Food Records</h2>

            <table>

                <thead>

                    <tr>

                        <th>Food</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Location</th>

                    </tr>

                </thead>

                <tbody id="foodTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="assets/js/dashboard.js"></script>

</body>

</html>
